[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-search-visibility-audit"
version = "1.0.0"
description = "Audit technical AI search visibility and generate llms.txt and JSON-LD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christian Terrone"}]
dependencies = []

[project.scripts]
ai-search-visibility-audit = "ai_search_visibility_audit.cli:main"

[tool.setuptools.packages.find]
include = ["ai_search_visibility_audit*"]

[tool.setuptools.package-data]
ai_search_visibility_audit = [
    "fixtures/northwind-dental/*.html",
    "fixtures/northwind-dental/*.txt",
    "fixtures/northwind-dental/about/*.html",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
